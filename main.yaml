---

- name: Configure Linux
  hosts: localhost
  connection: local

  tasks:
    - name: Setup
      when: '"setup" in rolesToRun'
      ansible.builtin.include_role:
        name: setup
    
    - name: Profile
      when: '"profile" in rolesToRun'
      ansible.builtin.include_role:
        name: profile
    
    - name: Packages
      when: '"packages" in rolesToRun'
      ansible.builtin.include_role:
        name: packages
    
    - name: Flatpaks
      when: '"flatpaks" in rolesToRun'
      ansible.builtin.include_role:
        name: flatpaks
    
    - name: Fonts
      when: '"fonts" in rolesToRun'
      ansible.builtin.include_role:
        name: fonts
    
    - name: Nautilus
      when: 'is_gnome and "nautilus" in rolesToRun'
      ansible.builtin.include_role:
        name: nautilus
    
    - name: Extensions
      when: '"extensions" in rolesToRun'
      ansible.builtin.include_role:
        name: extensions
    
    - name: Terminals
      when: '"terminals" in rolesToRun'
      ansible.builtin.include_role:
        name: terminals
    
    - name: Gnome
      when: 'is_gnome and "gnome" in rolesToRun'
      ansible.builtin.include_role:
        name: gnome  