---

- name: Configure Linux
  hosts: localhost
  connection: local

  tasks:
    - name: Setup
      when: '"setup" in rolesToRun'
      ansible.builtin.include_role:
        name: setup
    
    - name: Profile
      when: '"profile" in rolesToRun'
      ansible.builtin.include_role:
        name: profile
    
