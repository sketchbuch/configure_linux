---

- name: clock | Configure clock and datetime settings
  become: true
  become_user: "{{ user.username }}"
  block:
    - name: clock | Set time to use 24h Format
      community.general.dconf:
        key: /org/gnome/desktop/interface/clock-format
        state: present
        value: "'24h'"

    - name: clock | Show date next to clock
      community.general.dconf:
        key: /org/gnome/desktop/interface/clock-show-date
        state: present
        value: "true"

    - name: clock | Show week day next to clock
      community.general.dconf:
        key: /org/gnome/desktop/interface/clock-show-weekday
        state: present
        value: "true"